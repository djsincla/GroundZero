[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "groundzero"
version = "0.6.0"
description = "API-first bare-metal to VMware Holodeck provisioning: BMC preflight, OS install, Holodeck deployment"
readme = "README.md"
license = "Apache-2.0 AND LicenseRef-CA-Inc"
license-files = ["LICENSE", "NOTICE", "src/groundzero/vcf_readiness/LICENSE.md"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "typer>=0.12",
    "cryptography>=43",
    "pyvmomi>=9.1.1.0",
    "pycdlib>=1.21.0",
    "paramiko>=5.0.0",
    "dnspython>=2.8.0",
]

[project.scripts]
groundzero = "groundzero.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-playwright>=0.9.0",
    "types-paramiko>=5.0.0.20260724",
]

[tool.hatch.build.targets.wheel]
packages = ["src/groundzero"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "T20", "S110", "S112", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/groundzero"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Browser tests run in their own process (pytest -m browser): Playwright's sync API keeps an event loop
# running that breaks pytest-asyncio tests sharing the session.
addopts = "-q -m 'not live and not browser and not container'"
markers = [
    "functional: black-box tests driving the real server and CLI processes",
    "live: talks to real lab hardware configured in .env (opt-in: pytest -m live)",
    "browser: drives the web UI in headless Chromium (Playwright)",
    "container: builds and runs the OCI image with Podman (opt-in: pytest -m container)",
]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[[tool.mypy.overrides]]
# pyVim connect helpers (SmartConnect/Disconnect) are untyped; only the ESXi adapter calls them.
module = ["groundzero.esxi.reader"]
disallow_untyped_calls = false
