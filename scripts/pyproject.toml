[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "groundzero"
version = "9.7.2"
description = "GroundZero — VCF / vSphere 9.1 HCI Readiness — Redfish-based hardware compatibility scanner"
readme = "README.md"
license = { text = "CA, Inc. Software License Agreement" }
requires-python = ">=3.9"
dependencies = []  # Zero external dependencies — stdlib only

keywords = [
    "vmware", "vcf", "vsan", "redfish", "bmc", "idrac", "ilo",
    "hci", "hardware-assessment", "compatibility",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Topic :: System Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.scripts]
groundzero = "groundzero.cli:main"

[project.urls]
Homepage = "https://github.com/djsincla/GroundZero"
"Bug Tracker" = "https://github.com/djsincla/GroundZero/issues"
Documentation = "https://github.com/djsincla/GroundZero/blob/main/docs/"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["groundzero*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=line --no-header -rfE"
markers = [
    "replay: marks tests as offline replay tests using recorded Redfish dumps (deselect with '-m \"not replay\"')",
    "live: marks tests requiring live BMC network access (deselect with '-m \"not live\"')",
    "dell: marks tests for Dell PowerEdge platforms",
    "hpe: marks tests for HPE ProLiant platforms",
    "supermicro: marks tests for Supermicro platforms",
    "cisco: marks tests for Cisco IMC platforms",
    "lenovo: marks tests for Lenovo ThinkSystem platforms",
    "intel: marks tests for Intel BMC platforms",
]

[tool.pyinstaller]
# Build targets — run via build-web.sh or build-web.bat
# macOS:   pyinstaller --onefile --collect-all groundzero groundzero_web.py
# Windows: pyinstaller --onefile --collect-all groundzero groundzero_web.py
