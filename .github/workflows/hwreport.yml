name: hwreport

# Builds gz-hwreport, the standalone hardware report, as one executable per platform, checks the Node.js
# version, and attaches them all to the GitHub release. Runs when a release is published, or by hand (the files are then kept as artifacts).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: gz-hwreport-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: gz-hwreport-linux-arm64
          - os: macos-latest
            asset: gz-hwreport-macos-arm64
          - os: windows-latest
            asset: gz-hwreport-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Build
        shell: bash
        run: |
          uv run pyinstaller --onefile --name gz-hwreport --collect-submodules groundzero.redfish \
            --distpath dist --noconfirm --log-level WARN packaging/gz-hwreport.py
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mv "dist/gz-hwreport$ext" "dist/${{ matrix.asset }}"
      - name: Check it runs (a recorded R740xd, no network)
        shell: bash
        run: |
          "dist/${{ matrix.asset }}" --version
          "dist/${{ matrix.asset }}" --replay tests/fixtures/dell-r740xd 192.0.2.10 -o check
          ls check
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/${{ matrix.asset }}" --clobber

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check it runs on Node 20 (a recorded R740xd, no network)
        run: |
          node node/gz-hwreport.mjs --version
          node node/gz-hwreport.mjs --replay tests/fixtures/dell-r740xd 192.0.2.10 192.0.2.11 -o check
          ls check
      - name: Package it with its README
        run: |
          mkdir -p dist/gz-hwreport-node
          cp node/gz-hwreport.mjs node/README.md dist/gz-hwreport-node/
          cp node/README.md dist/gz-hwreport-README.md
          cp node/gz-hwreport.mjs dist/
          (cd dist && zip -r gz-hwreport-node.zip gz-hwreport-node)
          unzip -l dist/gz-hwreport-node.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gz-hwreport-node
          path: |
            dist/gz-hwreport.mjs
            dist/gz-hwreport-README.md
            dist/gz-hwreport-node.zip
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" --clobber \
            dist/gz-hwreport.mjs dist/gz-hwreport-README.md dist/gz-hwreport-node.zip
